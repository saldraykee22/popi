<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920">
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Work+Sans:wght@400;600&amp;display=swap');</style>
  <defs>
    <filter id="golge" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <image href="arka.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>

  <rect id="panel" x="90" y="330" width="900" height="580" fill="#1B2A4A" fill-opacity="0.92" filter="url(#golge)"/>

  <text id="marka" x="150" y="412" font-family="'Work Sans', Arial, sans-serif" font-weight="600" font-size="32" letter-spacing="3" fill="#E8B64C">Kuzey Fırın</text>
  <rect x="150" y="436" width="56" height="4" fill="#E8B64C"/>

  <text id="baslik" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="104" fill="#FBF6EA"><tspan x="150" y="560">Yeni Sezon</tspan><tspan x="150" dy="110">Ekmekleri</tspan></text>

  <text id="alt" x="150" y="744" font-family="'Work Sans', Arial, sans-serif" font-weight="400" font-size="34" fill="#E9E1CC">Ekşi mayalı, her sabah 07.00'de fırından</text>

  <rect x="150" y="798" width="370" height="72" fill="#E8B64C"/>
  <text id="fiyat" x="180" y="845" font-family="'Work Sans', Arial, sans-serif" font-weight="600" font-size="36" fill="#1B2A4A">Köy ekmeği 85 ₺</text>
