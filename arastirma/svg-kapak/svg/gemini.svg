<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap');

      .font-title {
        font-family: 'Fraunces', Georgia, serif;
      }
      .font-sans {
        font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Arka plan görseli -->
  <image href="arka.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>

  <!-- Kontrast paneli: Taş duvar önünde okunaklılığı sağlayan fırın menü levhası -->
  <g filter="url(#panel-shadow)">
    <rect x="90" y="280" width="900" height="550" rx="20" fill="#1B2A4A" fill-opacity="0.92"/>
  </g>

  <!-- Marka adı -->
  <text id="marka" x="540" y="366" text-anchor="middle" class="font-sans" font-size="24" font-weight="600" letter-spacing="6" fill="#E8B64C">Kuzey Fırın</text>

  <!-- Minimal ayırıcı aksan -->
  <line x1="500" y1="396" x2="580" y2="396" stroke="#E8B64C" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

  <!-- Başlık -->
  <text id="baslik" x="540" y="482" text-anchor="middle" class="font-title" font-size="82" font-weight="700" fill="#FAF6EE">
    <tspan x="540" dy="0">Yeni Sezon</tspan>
    <tspan x="540" dy="94">Ekmekleri</tspan>
  </text>

  <!-- Alt açıklama satırı -->
  <text id="alt" x="540" y="658" text-anchor="middle" class="font-sans" font-size="30" font-weight="400" fill="#E2DAD0">Ekşi mayalı, her sabah 07.00'de fırından</text>

  <!-- Fiyat etiketi rozeti -->
  <rect x="350" y="714" width="380" height="66" rx="33" fill="#E8B64C"/>
  <text id="fiyat" x="540" y="758" text-anchor="middle" class="font-sans" font-size="32" font-weight="600" fill="#1B2A4A">Köy ekmeği 85 ₺</text>
</svg>
