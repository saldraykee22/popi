<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Kuzey Fırın, Yeni Sezon Ekmekleri">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;600&display=swap');
      .display { font-family: 'Fraunces', Georgia, serif; }
      .sans    { font-family: 'IBM Plex Sans', Arial, sans-serif; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1B2A4A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <image href="arka.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>

  <g filter="url(#softShadow)">
    <line x1="486" y1="300" x2="594" y2="300" stroke="#E8B64C" stroke-width="4" stroke-linecap="round"/>
    <text id="marka" class="display" x="540" y="372" text-anchor="middle" font-size="46" letter-spacing="5" fill="#1B2A4A">Kuzey Fırın</text>
    <text id="baslik" class="display" x="540" y="500" text-anchor="middle" font-size="82" font-weight="600" fill="#1B2A4A">Yeni Sezon Ekmekleri</text>
    <text id="alt" class="sans" x="540" y="578" text-anchor="middle" font-size="36" fill="#1B2A4A" fill-opacity="0.85">Ekşi mayalı, her sabah 07.00'de fırından</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="330" y="648" width="420" height="92" rx="46" fill="#E8B64C"/>
    <text id="fiyat" class="sans" x="540" y="707" text-anchor="middle" font-size="38" font-weight="600" fill="#1B2A4A">Köy ekmeği 85 ₺</text>
  </g>
</svg>