<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <image href="arka.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Work+Sans:wght@400;500;600&amp;display=swap');
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .sans { font-family: 'Work Sans', Arial, sans-serif; }
  </style>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#soft-shadow)">
    <rect x="118" y="348" width="844" height="404" rx="18" fill="#1B2A4A" fill-opacity="0.88"/>
    <rect x="118" y="348" width="7" height="404" rx="3.5" fill="#E8B64C"/>
    <text id="baslik" x="166" y="452" class="serif" font-size="66" font-weight="600" fill="#FFF8E9" letter-spacing="-1.1">Yeni Sezon Ekmekleri</text>
    <text id="alt" x="168" y="518" class="sans" font-size="29" font-weight="400" fill="#F3E8D1">Ekşi mayalı, her sabah 07.00'de fırından</text>
    <rect x="166" y="574" width="342" height="70" rx="8" fill="#E8B64C"/>
    <text id="fiyat" x="188" y="620" class="sans" font-size="29" font-weight="600" fill="#1B2A4A">Köy ekmeği 85 ₺</text>
    <text id="marka" x="168" y="706" class="serif" font-size="37" font-weight="500" fill="#E8B64C" letter-spacing="0.3">Kuzey Fırın</text>
  </g>
</svg>
